[package]
name = "openepoch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An original, clean-room epoch-spanning RTS for the browser (Rust + WebAssembly + WebGL2)"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
