[package]
name = "openepoch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An original, clean-room epoch-spanning RTS for the browser (Rust + WebAssembly + WebGL2)"

[lib]
crate-type = ["cdylib"]

[features]
ee2-reference = []
ee2-up15 = ["ee2-reference"]
ee2-roster6 = ["ee2-up15"]
ee2-render-meta7 = ["ee2-roster6"]
ee2-paidqueue7 = ["ee2-roster6"]
ee2-pack8 = ["ee2-paidqueue7", "ee2-render-meta7"]
ee2-civ8 = ["ee2-paidqueue7", "ee2-render-meta7"]
ee2-joint8 = ["ee2-civ8", "ee2-pack8"]
ee2-citizen9 = ["ee2-joint8"]
ee2-epoch-range13 = ["ee2-citizen9"]
ee2-ai9-planner-probe = ["ee2-citizen9"]
ee2-ai9-game-bridge = ["ee2-ai9-planner-probe"]
ee2-native13 = ["ee2-epoch-range13", "ee2-ai9-game-bridge"]
ee2-authored-valley37 = ["ee2-native13"]
ee2-authored-valley37-qa-commit = ["ee2-authored-valley37"]
ee2-valley39-preview = ["ee2-authored-valley37"]
ee2-valley47-archive-qa = ["ee2-authored-valley37"]
ee2-valley52-owned-qa = ["ee2-valley47-archive-qa"]
ee2-valley54-menu-qa = ["ee2-valley52-owned-qa", "ee2-valley39-preview"]
ee2-valley55-start-qa = ["ee2-valley54-menu-qa"]
ee2-valley56-terrain-qa = ["ee2-valley55-start-qa"]
ee2-valley71-neutral-qa = ["ee2-valley56-terrain-qa"]
ee2-valley74-city-footprint = ["ee2-valley71-neutral-qa"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
